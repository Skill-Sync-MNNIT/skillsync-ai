name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Root/Backend Dependencies
        run: npm ci
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint Backend
        run: npx eslint backend
      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint
      - name: Check Prettier
        run: npx prettier --check .

  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_key_1234567890_min_length
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_1234567890
      JWT_TOKEN_EXPIRES_IN: 1h
      JWT_REFRESH_TOKEN_EXPIRES_IN: 7d
      BREVO_API_KEY: xkeysib-mock-key
      BREVO_SENDER_EMAIL: test@example.com
      INTERNAL_SECRET: test_internal_secret
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: Install Root Dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Audit Root
        run: npm audit --audit-level=high || true
        continue-on-error: true

  test-ai-service:
    name: Test AI Service
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: mock-gemini-key
      PINECONE_API_KEY: mock-pinecone-key
      GROQ_API_KEY: mock-groq-key
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './ai-service/requirements.txt'
      - name: Install Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
      - name: Test
        working-directory: ./ai-service
        run: python -m pytest tests -v
      - name: Audit AI Service
        working-directory: ./ai-service
        run: pip-audit -r requirements.txt || true
        continue-on-error: true
